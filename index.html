<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AskAi</title>

  <link rel="stylesheet" href="style.css" />

</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div>

      <div class="logo">
        ✨ AskAi 👾
      </div>

      <button
        class="new-chat-btn"
        onclick="newChat()"
      >
        + New Chat
      </button>

    </div>

    <div class="sidebar-footer">
      Made with ❤️ by GOVIND VAISHNAV 🧿
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      AskAi
    </div>

    <!-- CHAT -->
    <div
      id="chatBox"
      class="chat-box"
    ></div>

    <!-- INPUT AREA -->
    <div class="input-wrapper">

      <div class="input-box">

        <!-- TEXTAREA -->
        <textarea
          id="topic"
          rows="1"
          placeholder="Message AskAi..."
        ></textarea>

        <!-- IMAGE -->
        <label
          for="imageInput"
          class="icon-btn"
        >
          🖼️
        </label>

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          hidden
        />

        <!-- VOICE -->
        <button
          id="voiceBtn"
          class="icon-btn"
        >
          🎤
        </button>

        <!-- SEND -->
        <button
          id="sendBtn"
          onclick="learnTopic()"
        >
          ↑
        </button>

      </div>

    </div>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
