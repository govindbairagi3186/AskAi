<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>AskAi</title>

  <link rel="stylesheet" href="style.css"/>

</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div>

      <div class="logo">
        ✨ AskAi
      </div>

      <button class="new-chat-btn" onclick="newChat()">
        + New Chat
      </button>

    </div>

    <div class="sidebar-footer">
      Made with ❤️ by GOVIND VAISHNAV🧿
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOP -->
    <div class="topbar">
      AskAi
    </div>

    <!-- CHAT -->
    <div id="chatBox" class="chat-box"></div>

    <!-- INPUT -->
    <div class="input-wrapper">

      <div class="input-box">

        <textarea
          id="topic"
          rows="1"
          placeholder="Message AskAi..."
        ></textarea>

        <button id="sendBtn" onclick="learnTopic()">
          ↑
        </button>

      </div>

    </div>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
