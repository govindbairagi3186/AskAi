<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AskAi</title>

  <!-- FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

<!-- LANDING PAGE -->
<!-- LOADING -->
<div id="loadingScreen">

  <div class="loader-circle"></div>

  <h2>Preparing AskAi...</h2>

</div>
  <section id="landingPage">


 <!-- NAVBAR -->
<nav class="navbar">

  <div class="logo">
    ✨ AskAi 👾
  </div>

  <div class="nav-right">

    <!-- THEME SWITCH -->
    <button
      id="themeToggle"
      class="theme-btn"
    >
      👾 Shastra
    </button>

    <!-- START -->
    <button
      class="start-btn"
      onclick="startApp()"
    >
      Get Started
    </button>

  </div>

</nav>

  <!-- HERO -->
  <div class="hero">

  <div class="hero-left">

    <h1 class="hero-title">
      Your Friendly
      <span>AI Companion</span>
    </h1>

    <p class="hero-subtitle">
      Talk naturally, learn faster,
      code smarter and explore ideas
      with your personal AI friend.
    </p>

    <div class="hero-buttons">

      <button
        class="hero-btn"
        onclick="startLoading()"
      >
        Get Started
      </button>

      <button
        class="hero-btn secondary"
        onclick="startLoading()"
      >
        Explore AI
      </button>

    </div>

  </div>

  <div class="hero-right">

    <div class="ai-orb"></div>

  </div>

</div>

</section>

<!-- MAIN APP -->
<div
  class="app"
  id="app"
>

  
  <!-- SIDEBAR -->
<!-- SIDEBAR -->
<aside class="sidebar">

  <div>

    <div class="logo">
      ✨ AskAi 👾
    </div>

    <button
      class="new-chat-btn"
      onclick="newChat()"
    >
      + New Chat
    </button>

    <!-- RECENT -->
    <div class="sidebar-section">

      <h3>Recent Chats</h3>

      <div id="recentChats"></div>

    </div>

  </div>
  <!-- FOOTER -->
  <div class="sidebar-footer">
    AskAi can make mistakes. please double check if possible.
  </div>

</aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <span>AskAi</span>

    </div>

    <!-- CHAT -->
    <div
      id="chatBox"
      class="chat-box"
    ></div>

    <!-- INPUT -->
    <div class="input-wrapper">

      <div class="input-box">

        <!-- TEXTAREA -->
        <textarea
          id="topic"
          rows="1"
          placeholder="Message AskAi..."
        ></textarea>

        <!-- VOICE -->
        <button
          id="voiceBtn"
          class="icon-btn"
        >
          🎤
        </button>

        <!-- SEND -->
        <button
          id="sendBtn"
          onclick="learnTopic()"
        >
          ↑
        </button>

      </div>

    </div>

  </main>

</div>

<!-- FOOTER -->
<footer class="footer">
  Made with ❤️ by Govind Vaishnav 🧿
</footer>

<!-- SCRIPT -->
<script src="script.js"></script>

</body>
</html>
