<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AskAi</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body class="dark">

<!-- FRONT PAGE -->
<section id="landingPage">

  <!-- THEME BUTTON -->
  <button
    id="themeToggle"
    class="theme-btn"
  >
    👾 Shastra
  </button>

  <div class="hero">

    <h1>
      AskAi
    </h1>

    <p>
      Your intelligent AI friend for chatting,
      learning, coding, writing and creativity.
    </p>

    <div class="hero-buttons">

      <button
        class="hero-btn"
        onclick="startApp()"
      >
        Get Started
      </button>

      <button
        class="hero-btn secondary"
        onclick="startApp()"
      >
        Explore AI
      </button>

    </div>

  </div>

</section>

<!-- LOADING SCREEN -->
<div id="loader">

  <div class="loader-circle"></div>

  <h2>Loading AskAi...</h2>

</div>

<!-- MAIN APP -->
<div
  class="app"
  id="app"
>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div>

      <div class="logo">
        ✨ AskAi 👾
      </div>

      <button
        class="new-chat-btn"
        onclick="newChat()"
      >
        + New Chat
      </button>

      <h3 class="recent-title">
        Recent Chats
      </h3>

      <div id="historyList"></div>

    </div>

    <div class="sidebar-footer">
      Made with ❤️ by Govind Vaishnav 🧿
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <span>AskAi</span>

    </div>

    <!-- CHAT -->
    <div
      id="chatBox"
      class="chat-box"
    ></div>

    <!-- FOOTER -->
    <div class="chat-footer">
      AskAi can make mistakes. Double Check if possible.
    </div>

    <!-- INPUT -->
    <div class="input-wrapper">

      <div class="input-box">

        <!-- FILE -->
        <label
          for="fileInput"
          class="icon-btn"
        >
          📎
        </label>

        <input
          type="file"
          id="fileInput"
          hidden
        />

        <!-- TEXTAREA -->
        <textarea
          id="topic"
          rows="1"
          placeholder="Message AskAi..."
        ></textarea>

        <!-- VOICE -->
        <button
          id="voiceBtn"
          class="icon-btn"
        >
          🎤
        </button>

        <!-- SEND -->
        <button
          id="sendBtn"
          onclick="learnTopic()"
        >
          ↑
        </button>

      </div>

    </div>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
