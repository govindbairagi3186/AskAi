<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AskAi</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />

</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

<div>

  <div class="logo">
    ✨ AskAi 👾
  </div>

  <button
    class="new-chat-btn"
    onclick="newChat()"
  >
    + New Chat
  </button>

  <!-- CHAT HISTORY -->
  <div id="historyList" class="history-list"></div>

</div>

    <div class="sidebar-footer">
      Made with ❤️ by GOVIND VAISHNAV 🧿
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
   <div class="topbar">

  <span>AskAi</span>

  <select id="modelSelect">

    <option value="mistral">
      Mistral
    </option>

    <option value="deepseek">
      DeepSeek
    </option>

    <option value="llama">
      Llama
    </option>

  </select>

</div>

    <!-- CHAT -->
    <div
      id="chatBox"
      class="chat-box"
    ></div>

    <!-- INPUT -->
    <div class="input-wrapper">

      <div class="input-box">

        <textarea
          id="topic"
          rows="1"
          placeholder="Message AskAi..."
        ></textarea>

<!-- FILE-->
<label
  for="fileInput"
  class="icon-btn"
>
  📎
</label>

<input
  type="file"
  id="fileInput"
  hidden
/>
        <!-- VOICE -->
        <button
          id="voiceBtn"
          class="icon-btn"
        >
          🎤
        </button>

        <!-- SEND -->
        <button
          id="sendBtn"
          onclick="learnTopic()"
        >
          ↑
        </button>

      </div>

    </div>

  </main>

</div>

<script src="script.js"></script>

<!-- FOOTER -->
<footer class="footer">
  Made with ❤️ by Govind Vaishnav 🧿
</footer>
</body>
</html>
