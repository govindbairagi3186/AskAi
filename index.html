<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AskAi</title>

  <!-- FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

<!-- LANDING PAGE -->
<section id="landingPage">

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="logo">
      ✨ AskAi 👾
    </div>

    <button
      class="start-btn"
      onclick="startApp()"
    >
      Get Started
    </button>

  </nav>

  <!-- HERO -->
  <div class="hero">

    <div class="hero-left">

      <h1>
        The Future of
        <span>AI Assistance</span>
      </h1>

      <p>
        Your intelligent AI assistant for
        learning, coding, writing,
        creativity and productivity.
      </p>

      <div class="hero-buttons">

        <button
          class="hero-btn"
          onclick="startApp()"
        >
          Explore AI
        </button>

      </div>

    </div>

  </div>

</section>

<!-- MAIN APP -->
<div
  class="app"
  id="app"
>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div>

      <!-- LOGO -->
      <div class="logo">
        ✨ AskAi 👾
      </div>

      <!-- NEW CHAT -->
      <button
        class="new-chat-btn"
        onclick="newChat()"
      >
        ✏️ New chat
      </button>

      <!-- SEARCH -->
      <div class="sidebar-item">
        🔍 Search chats
      </div>

      <!-- PROJECTS -->
      <div class="sidebar-item">
        📁 Projects
      </div>

      <!-- CODEX -->
      <div class="sidebar-item">
        ⚙️ Codex
      </div>

      <!-- MORE -->
      <div class="sidebar-item">
        ⋯ More
      </div>

      <!-- PINNED -->
      <div class="sidebar-title">
        Pinned
      </div>

      <div class="history-item active">
        💬 AI Tutor Chatbot
      </div>

      <!-- RECENTS -->
      <div class="sidebar-title">
        Recents
      </div>

      <!-- HISTORY -->
      <div
        id="historyList"
        class="history-list"
      ></div>

    </div>

    <!-- FOOTER -->
    <div class="sidebar-footer">
      Made with ❤️ by GOVIND VAISHNAV 🧿
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <span>AskAi</span>

    </div>

    <!-- CHAT -->
    <div
      id="chatBox"
      class="chat-box"
    ></div>

    <!-- INPUT -->
    <div class="input-wrapper">

      <div class="input-box">

        <!-- TEXTAREA -->
        <textarea
          id="topic"
          rows="1"
          placeholder="Message AskAi..."
        ></textarea>

        <!-- VOICE -->
        <button
          id="voiceBtn"
          class="icon-btn"
        >
          🎤
        </button>

        <!-- SEND -->
        <button
          id="sendBtn"
          onclick="learnTopic()"
        >
          ↑
        </button>

      </div>

    </div>

  </main>

</div>

<!-- FOOTER -->
<footer class="footer">
  Made with ❤️ by Govind Vaishnav 🧿
</footer>

<!-- SCRIPT -->
<script src="script.js"></script>

</body>
</html>
